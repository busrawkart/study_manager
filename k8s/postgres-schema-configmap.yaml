apiVersion: v1
data:
  schema.sql: "CREATE TABLE IF NOT EXISTS users (\r\n    user_id INTEGER GENERATED
    BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n    name TEXT NOT NULL,\r\n    surname
    TEXT NOT NULL,\r\n    display_name TEXT,\r\n    email TEXT UNIQUE NOT NULL,\r\n
    \   password_hashed TEXT NOT NULL,\r\n    birthdate DATE,\r\n    profile_photo
    TEXT,\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\nCREATE
    TABLE IF NOT EXISTS courses (\r\n    course_id INTEGER GENERATED BY DEFAULT AS
    IDENTITY PRIMARY KEY,\r\n    course_name TEXT NOT NULL,\r\n    user_id INTEGER
    NOT NULL,\r\n\r\n    FOREIGN KEY (user_id) REFERENCES users(user_id)\r\n);\r\n\r\nCREATE
    TABLE IF NOT EXISTS categories (\r\n    category_id INTEGER GENERATED BY DEFAULT
    AS IDENTITY PRIMARY KEY,\r\n    category_name TEXT NOT NULL,\r\n    user_id INTEGER
    NOT NULL,\r\n\r\n    FOREIGN KEY (user_id) REFERENCES users(user_id)\r\n);\r\n\r\nCREATE
    TABLE IF NOT EXISTS tasks (\r\n    task_id INTEGER GENERATED BY DEFAULT AS IDENTITY
    PRIMARY KEY,\r\n    task_name TEXT NOT NULL,\r\n    description TEXT,\r\n    deadline
    TEXT NOT NULL,\r\n    course_id INTEGER NOT NULL,\r\n    category_id INTEGER NOT
    NULL,\r\n    user_id INTEGER NOT NULL,\r\n\r\n    FOREIGN KEY (course_id) REFERENCES
    courses(course_id),\r\n    FOREIGN KEY (category_id) REFERENCES categories(category_id),\r\n
    \   FOREIGN KEY (user_id) REFERENCES users(user_id)\r\n);\r\n\r\nCREATE TABLE
    IF NOT EXISTS logs (\r\n    log_id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY
    KEY,\r\n    user_id INTEGER NOT NULL,\r\n    login_time TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   status TEXT NOT NULL,\r\n\r\n    FOREIGN KEY (user_id) REFERENCES users(user_id)\r\n);\r\n\r\nCREATE
    TABLE IF NOT EXISTS password_reset_tokens (\r\n    token_id INTEGER GENERATED
    BY DEFAULT AS IDENTITY PRIMARY KEY,\r\n    user_id INTEGER NOT NULL,\r\n    token
    TEXT NOT NULL UNIQUE,\r\n    expires_at TIMESTAMP NOT NULL,\r\n    used INTEGER
    DEFAULT 0,\r\n\r\n    FOREIGN KEY (user_id) REFERENCES users(user_id)\r\n);"
kind: ConfigMap
metadata:
  name: postgres-schema
