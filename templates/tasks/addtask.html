{% extends "base.html" %}

{% block title %}
Add a task
{% endblock %}

{% block content %}

<h1>Add a task</h1>

{% if error %}
	<p class="error-message">{{ error }}</p>
{% endif %}

<form method = "POST">
	<input
		type="hidden"
		name="csrf_token"
		value="{{ csrf_token() }}">
	<select
		id="category"
		name="category_id"
		class="loginput"
		required>
		<option value="">Select a category</option>
		{% for category in categories %}
			<option value = "{{category['category_id']}}"
			{% if form and form.get('category_id') == category['category_id'] | string %} selected {% endif %}>
				{{category['category_name']}}	
			</option>
		{% endfor %}

		<option value = "new"
			{% if form and form.get('category_id') == 'new' %} selected {% endif %}>
			+ New category</option>
	</select>

	<div id = "newcat" style = "display: none;">
		<input type = "text"
			name = "newcat"
			class="loginput"
			value="{{ form.get('newcat', '') if form else '' }}"
			placeholder = "New category name">
	</div>

	<select
		id="course"
		name="course_id"
		class="loginput"
		required>
		<option value="">Select a course</option>
		{% for course in courses %}
			<option value = "{{course['course_id']}}"
			{% if form and form.get('course_id') == course['course_id'] | string %} selected {% endif %}>
				{{course['course_name']}}	
			</option>
		{% endfor %}

		<option value = "new"
			{% if form and form.get('course_id') == 'new' %} selected {% endif %}>
			+ New course</option>
	</select>

	<div id = "newcourse" style = "display: none;">
		<input type = "text"
			name = "newcourse"
			class="loginput"
			value="{{ form.get('newcourse', '') if form else '' }}"
			placeholder = "New course name">
	</div>
	
	<input
		type="text"
		name="taskname"
		id="taskname"
		class="loginput"
		value="{{ form.get('taskname', '') if form else '' }}"
		placeholder="Name"
		required>
	<textarea
		rows="2"
		cols="15"
		name="taskdesc"
		id="taskdesc"
		class="loginput"
		placeholder="Description">{{ form.get('taskdesc', '') if form else '' }}</textarea>
	<input
		type="datetime-local"
		name="deadline"
		id="deadline"
		class="loginput"
		value="{{ form.get('deadline', '') if form else '' }}"
		placeholder="Deadline"
		required>
	<button
		type="submit"
		class="logbut">
		ADD
	</button>
	<button
		type ="reset"
		class="logbut">
		CLEAR
	</button>

</form>

<script>

	const category = document.getElementById("category");
	const newcat = document.getElementById("newcat");
	const newcatinput = document.querySelector("input[name='newcat']");

	category.addEventListener("change", function(){

		if (this.value === "new"){
			newcat.style.display = "block";
			newcatinput.required = true;
		} else{
			newcat.style.display = "none";
			newcatinput.required = false;
			newcatinput.value = "";
		}

	});


	const course = document.getElementById("course");
	const newcourse = document.getElementById("newcourse");
	const newcourseinput = document.querySelector("input[name='newcourse']");

	course.addEventListener("change", function(){

		if (this.value === "new"){
			newcourse.style.display = "block";
			newcourseinput.required = true;
		} else{
			newcourse.style.display = "none";
			newcourseinput.required = false;
			newcourseinput.value = "";
		}

	});

	if (category.value === "new"){
		newcat.style.display = "block";
		newcatinput.required = true;
	}

	if (course.value === "new"){
		newcourse.style.display = "block";
		newcourseinput.required = true;
	}

</script>


{% endblock %}
