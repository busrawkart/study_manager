{% extends "base.html" %}

{% block title %}
Add a task
{% endblock %}

{% block content %}

<h1>Add a task</h1>

<form method = "POST">
	<input
		type="hidden"
		name="csrf_token"
		value="{{ csrf_token() }}">
	<select
		id="category"
		name="category_id"
		class="loginput"
		required>
		<option value="">Select a category</option>
		{% for category in categories %}
			<option value = "{{category['category_id']}}">
				{{category['category_name']}}	
			</option>
		{% endfor %}

		<option value = "new">+ New category</option>
	</select>

	<div id = "newcat" style = "display: none;">
		<input type = "text"
			name = "newcat"
			class="loginput"
			placeholder = "New category name">
	</div>

	<select
		id="course"
		name="course_id"
		class="loginput"
		required>
		<option value="">Select a course</option>
		{% for course in courses %}
			<option value = "{{course['course_id']}}">
				{{course['course_name']}}	
			</option>
		{% endfor %}

		<option value = "new">+ New course</option>
	</select>

	<div id = "newcourse" style = "display: none;">
		<input type = "text"
			name = "newcourse"
			class="loginput"
			placeholder = "New course name">
	</div>
	
	<input
		type="text"
		name="taskname"
		id="taskname"
		class="loginput"
		placeholder="Name"
		required>
	<textarea
		rows="2"
		cols="15"
		name="taskdesc"
		id="taskdesc"
		class="loginput"
		placeholder="Description"></textarea>
	<input
		type="datetime-local"
		name="deadline"
		id="deadline"
		class="loginput"
		placeholder="Deadline"
		required>
	<button
		type="submit"
		class="logbut">
		ADD
	</button>
	<button
		type ="reset"
		class="logbut">
		CLEAR
	</button>

</form>

<script>

	const category = document.getElementById("category");
	const newcat = document.getElementById("newcat");
	const newcatinput = document.querySelector("input[name='newcat']");

	category.addEventListener("change", function(){

		if (this.value === "new"){
			newcat.style.display = "block";
			newcatinput.required = true;
		} else{
			newcat.style.display = "none";
			newcatinput.required = false;
			newcatinput.value = "";
		}

	});


	const course = document.getElementById("course");
	const newcourse = document.getElementById("newcourse");
	const newcourseinput = document.querySelector("input[name='newcourse']");

	course.addEventListener("change", function(){

		if (this.value === "new"){
			newcourse.style.display = "block";
			newcourseinput.required = true;
		} else{
			newcourse.style.display = "none";
			newcourseinput.required = false;
			newcourseinput.value = "";
		}

	});

</script>


{% endblock %}
