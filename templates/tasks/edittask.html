{% extends "base.html" %}

{% block title %}
Edit task
{% endblock %}

{% block content %}

<h1>Edit task</h1>

{% if error %}
	<p class="error">{{ error }}</p>
{% endif %}

<form method = "POST">
	<input
		type="hidden"
		name="csrf_token"
		value="{{ csrf_token() }}">
	<select
		name="category_id"
		id="category"
		class="loginput"
		required>
		<option
			value="">
			Select a category
		</option>
		{% for category in categories %}
			<option value="{{category['category_id']}}"
			{% if form and form.get("category_id") == category['category_id'] | string %}
				selected
			{% elif not form and category['category_id']==task['category_id'] %}
				selected
			{% endif %}>
				{{category['category_name']}}
			</option>
		{% endfor %}

		<option
			value="new"
			{% if form and form.get("category_id") == "new" %}
				selected
			{% endif %}>
			+ New category
		</option>
	</select>

	<div
		id="newcat"
		style="display: none;">
		<input type="text"
			name="newcat"
			class="loginput"
			value="{{ form.get('newcat') if form else '' }}"
			placeholder="New category name">
	</div>

	<select
		name="course_id"
		id="course"
		class="loginput"
		required>
		<option
			value="">
			Select a course
		</option>
		{% for course in courses %}
			<option value="{{course['course_id']}}"
			{% if form and form.get("course_id") == course['course_id'] | string %}
				selected
			{% elif not form and course['course_id']==task['course_id'] %}
				selected
			{% endif %}>
				{{course['course_name']}}	
			</option>
		{% endfor %}

		<option
			value="new"
			{% if form and form.get("course_id") == "new" %}
				selected
			{% endif %}>
			+ New course
		</option>
	</select>

	<div
		id="newcourse"
		style="display: none;">
		<input
			type="text"
			name="newcourse"
			class="loginput"
			value="{{ form.get('newcourse') if form else '' }}"
			placeholder="New course name">
	</div>
	
	<input
		type="text"
		name="taskname"
		id="taskname"
		class="loginput"
		value="{{ form.get('taskname') if form else task['task_name'] }}"
		placeholder="Name"
		required>
	
	<textarea
		rows="2"
		cols="15"
		name="taskdesc"
		id="taskdesc"
		class="loginput"
		placeholder="Description">{{ form.get('taskdesc') if form else task['description'] }}</textarea>

	<input
		type="datetime-local"
		name="deadline"
		id="deadline"
		class="loginput"
		value="{{ form.get('deadline') if form else task['deadline'] }}"
		required>

	<button
		type="submit"
		class="logbut">
		UPDATE</button>
	<a
		href="{{url_for('tasks')}}">
		<button
			type="button"
			class="logbut">
			BACK
		</button>
	</a>
</form>

<script>

	const category = document.getElementById("category");
	const newcat = document.getElementById("newcat");
	const newcatinput = document.querySelector("input[name='newcat']");

	category.addEventListener("change", function(){

		if (this.value === "new"){
			newcat.style.display = "block";
			newcatinput.required = true;
		} else{
			newcat.style.display = "none";
			newcatinput.required = false;
			newcatinput.value = "";
		}
		
	});


	const course = document.getElementById("course");
	const newcourse = document.getElementById("newcourse");
	const newcourseinput = document.querySelector("input[name='newcourse']");

	course.addEventListener("change", function() {

		if (this.value === "new"){
			newcourse.style.display = "block";
			newcourseinput.required = true;
		} else{
			newcourse.style.display = "none";
			newcourseinput.required = false;
			newcourseinput.value = "";
		}
	});

	if (category.value === "new"){
		newcat.style.display = "block";
		newcatinput.required = true;
	}

	if (course.value === "new"){
		newcourse.style.display = "block";
		newcourseinput.required = true;
	}

</script>


{% endblock %}
